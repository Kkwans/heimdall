# Standalone validation stack. It intentionally does not inherit production
# container names, volumes, networks, ports, project mounts, or Docker socket.
name: heimdall-refinement

x-build-proxy-args: &build-proxy-args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  ALL_PROXY: ${ALL_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}

x-proxy-service: &proxy-service
  image: heimdall-refinement-proxy:${HEIMDALL_REFINEMENT_TAG:-phase1}
  build:
    context: .
    dockerfile: Dockerfile-proxy
    args: *build-proxy-args
    network: host
  volumes:
    - refinement-data:/data
    - refinement-logs:/logs
  networks:
    - refinement-net

services:
  tests:
    profiles: ["test"]
    image: heimdall-refinement-tests:${HEIMDALL_REFINEMENT_TAG:-phase1}
    build:
      context: .
      dockerfile: Dockerfile-tests
      args: *build-proxy-args
      network: host
    container_name: heimdall-refinement-tests
    networks:
      - refinement-net

  fake-upstream:
    image: heimdall-refinement-upstream:${HEIMDALL_REFINEMENT_TAG:-phase1}
    build:
      context: .
      dockerfile: Dockerfile-test-upstream
      args: *build-proxy-args
      network: host
    container_name: heimdall-refinement-upstream
    restart: unless-stopped
    networks:
      - refinement-net

  migrate:
    image: heimdall-refinement-proxy:${HEIMDALL_REFINEMENT_TAG:-phase1}
    container_name: heimdall-refinement-migrate
    command:
      - python
      - migrations.py
      - migrate
      - --database
      - /data/heimdall.db
      - --skip-backup
    restart: "no"
    volumes:
      - refinement-data:/data
      - refinement-logs:/logs
    networks:
      - refinement-net

  proxy:
    <<: *proxy-service
    container_name: heimdall-refinement-proxy
    restart: unless-stopped
    ports:
      - "${HEIMDALL_REFINEMENT_PROXY_PORT:-19888}:8888"
    environment:
      HEIMDALL_DATA_DIR: /data
      HEIMDALL_LOG_DIR: /logs
      HEIMDALL_PORT: 8888
      HEIMDALL_DETAIL_LOG: "false"
      HEIMDALL_LOG_BACKUP_DAYS: 30
      HEIMDALL_PROXY_PATH: /v1/chat/completions
      HEIMDALL_TIMEOUT: 10
      HEIMDALL_PROXY_EXTERNAL_PORT: ${HEIMDALL_REFINEMENT_PROXY_PORT:-19888}
      HEIMDALL_PROXY_HOST: proxy
      HEIMDALL_PROXY_CONTAINER_NAME: heimdall-refinement-proxy
      HEIMDALL_RETENTION_WORKER_ENABLED: "false"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8888/healthz', timeout=2); assert r.status == 200"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      fake-upstream:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  dashboard:
    image: heimdall-refinement-dashboard:${HEIMDALL_REFINEMENT_TAG:-phase1}
    build:
      context: .
      dockerfile: Dockerfile-dashboard
      args: *build-proxy-args
      network: host
    container_name: heimdall-refinement-dashboard
    restart: unless-stopped
    ports:
      - "${HEIMDALL_REFINEMENT_DASHBOARD_PORT:-18889}:8889"
    volumes:
      - refinement-data:/data
      - refinement-logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HEIMDALL_DATA_DIR: /data
      HEIMDALL_LOG_DIR: /logs
      HEIMDALL_DASHBOARD_PORT: 8889
      HEIMDALL_PROXY_HOST: proxy
      HEIMDALL_PROXY_CONTAINER_NAME: heimdall-refinement-proxy
      HEIMDALL_PROXY_EXTERNAL_PORT: ${HEIMDALL_REFINEMENT_PROXY_PORT:-19888}
      HEIMDALL_DASHBOARD_EXTERNAL_PORT: ${HEIMDALL_REFINEMENT_DASHBOARD_PORT:-18889}
      HEIMDALL_PUBLIC_BASE_URL: ""
      HEIMDALL_RETENTION_WORKER_ENABLED: "true"
      HEIMDALL_RETENTION_BATCH_SIZE: 100
      HEIMDALL_DETAIL_LOG: "false"
      HEIMDALL_LOG_BACKUP_DAYS: 30
      TZ: Asia/Shanghai
    networks:
      - refinement-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8889/api/proxy/status', timeout=2); assert r.status == 200"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      proxy:
        condition: service_healthy

volumes:
  refinement-data:
    name: heimdall-refinement-data
  refinement-logs:
    name: heimdall-refinement-logs

networks:
  refinement-net:
    name: heimdall-refinement-net
    driver: bridge
