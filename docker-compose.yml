# Heimdall - AI 请求代理 + 实时监控面板
# 双容器架构：代理服务 + 面板服务
# 部署：docker compose up -d
# 验证：docker compose config

name: heimdall

services:
  # ── 代理服务 ──────────────────────────────────────────────
  # 职责：AI 请求转发、Token 统计、日志记录
  # 端口：8888
  proxy:
    image: heimdall-proxy:latest
    build:
      context: .
      dockerfile: Dockerfile-proxy
    container_name: heimdall-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-9888}:8888"
    volumes:
      - heimdall-data:/data
      - heimdall-logs:/logs
    environment:
      - HEIMDALL_DATA_DIR=/data
      - HEIMDALL_LOG_DIR=/logs
      - HEIMDALL_PORT=8888
      - HEIMDALL_DETAIL_LOG=${HEIMDALL_DETAIL_LOG:-false}
      - HEIMDALL_LOG_BACKUP_DAYS=${HEIMDALL_LOG_BACKUP_DAYS:-30}
      - HEIMDALL_PROXY_PATH=${HEIMDALL_PROXY_PATH:-/v1/chat/completions}
      - HEIMDALL_TIMEOUT=${HEIMDALL_TIMEOUT:-120}
      - TZ=Asia/Shanghai
      - HEIMDALL_PROXY_EXTERNAL_PORT=${PROXY_PORT:-9888}
      - HEIMDALL_PROXY_HOST=heimdall-proxy
      - HEIMDALL_PROXY_CONTAINER_NAME=heimdall-proxy
      # NAS 直连 DNS 无法解析 api.deepseek.com；统一复用现有 Clash HTTP
      # 代理，保留容器内 Heimdall/Compose 网络不经外部代理。
      - HTTP_PROXY=${HEIMDALL_EGRESS_PROXY:-http://192.168.5.110:7890}
      - HTTPS_PROXY=${HEIMDALL_EGRESS_PROXY:-http://192.168.5.110:7890}
      - http_proxy=${HEIMDALL_EGRESS_PROXY:-http://192.168.5.110:7890}
      - https_proxy=${HEIMDALL_EGRESS_PROXY:-http://192.168.5.110:7890}
      - NO_PROXY=localhost,127.0.0.1,heimdall-proxy,proxy,172.26.0.0/16
      - no_proxy=localhost,127.0.0.1,heimdall-proxy,proxy,172.26.0.0/16
      - HEIMDALL_PUBLIC_BASE_URL=${HEIMDALL_PUBLIC_BASE_URL:-}
      - HEIMDALL_PUBLIC_OPENAI_BASE_URL=${HEIMDALL_PUBLIC_OPENAI_BASE_URL:-}
      - HEIMDALL_PUBLIC_ANTHROPIC_BASE_URL=${HEIMDALL_PUBLIC_ANTHROPIC_BASE_URL:-}
      - HEIMDALL_RETENTION_WORKER_ENABLED=false
    networks:
      - heimdall-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8888/healthz', timeout=2); assert r.status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── 面板服务 ──────────────────────────────────────────────
  # 职责：统计 API、代理管理、前端静态文件
  # 端口：8889
  dashboard:
    image: heimdall-dashboard:latest
    build:
      context: .
      dockerfile: Dockerfile-dashboard
    container_name: heimdall-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8889}:8889"
    volumes:
      - heimdall-data:/data
      - heimdall-logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro  # 挂载 Docker socket，允许管理容器
    environment:
      - HEIMDALL_DATA_DIR=/data
      - HEIMDALL_LOG_DIR=/logs
      - HEIMDALL_PORT=8889
      - HEIMDALL_DETAIL_LOG=${HEIMDALL_DETAIL_LOG:-false}
      - HEIMDALL_LOG_BACKUP_DAYS=${HEIMDALL_LOG_BACKUP_DAYS:-30}
      - DOCKER_HOST=unix:///var/run/docker.sock  # Docker API 地址
      - TZ=Asia/Shanghai
      - HEIMDALL_PROXY_HOST=heimdall-proxy
      - HEIMDALL_PROXY_CONTAINER_NAME=heimdall-proxy
      - HEIMDALL_PROXY_EXTERNAL_PORT=${PROXY_PORT:-9888}
      - HEIMDALL_DASHBOARD_EXTERNAL_PORT=${DASHBOARD_PORT:-8889}
      - HEIMDALL_PUBLIC_BASE_URL=${HEIMDALL_PUBLIC_BASE_URL:-}
      - HEIMDALL_PUBLIC_OPENAI_BASE_URL=${HEIMDALL_PUBLIC_OPENAI_BASE_URL:-}
      - HEIMDALL_PUBLIC_ANTHROPIC_BASE_URL=${HEIMDALL_PUBLIC_ANTHROPIC_BASE_URL:-}
      - HEIMDALL_RETENTION_WORKER_ENABLED=true
      - HEIMDALL_RETENTION_BATCH_SIZE=${HEIMDALL_RETENTION_BATCH_SIZE:-500}
    networks:
      - heimdall-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8889/api/proxy/status', timeout=2); assert r.status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      proxy:
        condition: service_healthy

# ── 共享卷 ──────────────────────────────────────────────────
# heimdall-data: SQLite 数据库、运行时配置
# heimdall-logs: 业务日志、系统日志
volumes:
  heimdall-data:
    name: heimdall-data
  heimdall-logs:
    name: heimdall-logs

# ── 网络 ────────────────────────────────────────────────────
networks:
  heimdall-net:
    name: heimdall-net
    driver: bridge
